syntax = "proto3";

package santa.common.v1;

import "google/protobuf/duration.proto";

option go_package = "buf.build/gen/go/northpolesec/protos/protocolbuffers/go/common";
option objc_class_prefix = "SNTPB";

// AIAccountInventoryScan carries the tuning parameters for a read-only sweep
// that reports which accounts AI assistants (Claude Code, Codex) are signed in
// with. Sleigh reads each tool's on-disk config in every user home on the host
// and never reports secrets: API keys and tokens are redacted.
//
// Shared between the SleighConfig command sleigh actually runs
// (santa.telemetry.v1.SleighAIAccountInventoryScan) and the workshop-issued
// host command (santa.commands.v1.AIAccountInventoryRequest) so the tunable
// surface stays identical. Transport details (the presigned upload target,
// host_id / host_name) live on those wrappers, not here.
message AIAccountInventoryScan {
  // Wall-clock budget for the whole scan. Zero / unset means unbounded.
  google.protobuf.Duration max_duration = 1;

  // Opaque ID the issuer assigns so it can find this scan's rows. When set,
  // sleigh writes it to every row's RunID instead of generating one.
  optional string run_id = 2;
}
