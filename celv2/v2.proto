syntax = "proto3";

package santa.cel.v2;

import "google/protobuf/timestamp.proto";

option go_package = "buf.build/gen/go/northpolesec/protos/protocolbuffers/go/celv2";

// ReturnValue is the type that should be returned from the expression and
// indicates to Santa the decision that should be applied to the execution.
// With the exception of AUDIT, these decisions map 1:1 with decisions from the
// santa.sync.v1.Policy enum but with fewer options. AUDIT is a CEL-only return
// value: it has no corresponding santa.sync.v1.Policy and is instead surfaced
// on sync events via the `audit_return` flag (see syncv2.Event.audit_return),
// while the execution itself is allowed as if ALLOWLIST had been returned.
//
// The expression can also return a boolean value, in which case true is
// equivalent to returning ALLOWLIST and false is equivalent to BLOCKLIST.
//
// Programs can return this enum either as integer values (e.g. 1 for ALLOWLIST)
// or by using the value names, as if they were keywords.
//
enum ReturnValue {
  // UNSPECIFIED means the program makes no decision. Fallback rule programs
  // return it to fall through to the next fallback rule. Ordinary rules may
  // return it on clients that support rule fall-through, where it means:
  // continue to the next rule in precedence order. Clients without that
  // support reject ordinary-rule expressions referencing this value at
  // compile time, which is the intended fail-safe.
  UNSPECIFIED = 0;

  // Allow the process to execute.
  ALLOWLIST = 1;

  // Allow the process to execute and if the client has transitive allowlisting
  // enabled, any files created by this binary will be locally allowlisted.
  ALLOWLIST_COMPILER = 2;

  // Block the process from executing.
  BLOCKLIST = 3;

  // Block the process from executing and do not show GUI notifications to the
  // user. This should be used sparingly as the behavior of applications being
  // silently blocked can be very confusing for users. Combines
  // SILENT_GUI_BLOCKLIST and SILENT_TTY_BLOCKLIST: neither GUI nor TTY
  // notifications are shown.
  SILENT_BLOCKLIST = 4;

  // Hold the process until the user has authorized it using biometrics (or, if
  // EnableStandalonePasswordFallback is enabled, with a password), allowing or
  // denying the execution as appropriate.
  REQUIRE_TOUCHID = 5;

  // Identical to REQUIRE_TOUCHID but goes straight to TouchID authorization
  // without showing the usual Santa block dialog.
  REQUIRE_TOUCHID_ONLY = 6;

  // Require this process to be run under `santactl sandbox` using a seatbelt
  // policy that is also attached to this rule.
  SEATBELT = 7;

  // Allow the process to execute, but flag the resulting event as having been
  // produced by an audit-only rule. Behaves identically to ALLOWLIST for the
  // executing client, but the corresponding event is always uploaded to the
  // sync server with the audit decision so audit matches can be distinguished
  // from ordinary allowlist matches.
  AUDIT = 8;

  // Block the process from executing and do not show GUI notifications to the
  // user, but still show TTY notifications.
  SILENT_GUI_BLOCKLIST = 9;

  // Block the process from executing and do not show TTY notifications to the
  // user, but still show GUI notifications.
  SILENT_TTY_BLOCKLIST = 10;
}

// A schedule of time windows, evaluated by the in_schedule() CEL function.
//
// The client parses this message out of the rule's expression at ingest, which
// is what lets it compute transition times for warnings and process
// termination without executing the program. Servers MUST emit it as a
// protojson string literal so that it remains statically readable.
//
// Parsing is strict and all-or-nothing: a schedule containing an unknown
// window kind, an empty windows list, or a window with no kind set fails to
// parse, and the rule carrying it is rejected at ingest. Partial enforcement
// of a schedule would change its meaning.
message Schedule {
  // A single absolute window. Seconds since the UNIX epoch, UTC.
  // Unset means unbounded on that side.
  message OneShot {
    optional int64 not_before = 1;
    optional int64 not_after = 2;
  }

  // A weekly repeat, stated in local wall-clock time in `timezone`.
  message Weekly {
    // Days the window starts on. Sunday = 0, matching both Go's time.Weekday
    // and CEL's getDayOfWeek().
    repeated int32 weekdays = 1;
    string start_tod = 2; // "HH:MM"
    string end_tod = 3; // "HH:MM"; <= start_tod means the next day
    string timezone = 4; // IANA name; required
  }

  // One window family. New kinds are added here, and only here. A client that
  // does not know a kind fails the parse, which fails the rule safely.
  message Window {
    oneof kind {
      OneShot one_shot = 1;
      Weekly weekly = 2;
    }
  }

  // The schedule is the union of its windows: an instant is in the schedule
  // when it is inside any window. Overlapping or adjacent windows are merged
  // by the evaluator before transition times are computed. At least one window
  // is required. A schedule holds at most 64 windows; clients reject larger
  // schedules at parse time.
  repeated Window windows = 1;
}

// The fields in this message provided to CEL programs.
message ExecutionContext {
  // The file being executed. All the fields in this message are based on the
  // content of the file, such that programs that only use fields in this
  // message can be cached.
  ExecutableFile target = 1;

  // The command-line arguments being passed to the new process.
  // Using this field will prevent the result from being cached.
  repeated string args = 2;

  // The environment variables being passed to the new process.
  // Using this field will prevent the result from being cached.
  map<string, string> envs = 3;

  // The effective user ID of the executing user.
  // Using this field will prevent the result from being cached.
  int32 euid = 4;

  // The current working directory of the process being executed.
  // Using this field will prevent the result from being cached.
  string cwd = 5;

  // The ancestor tree for this process. The first process in the list is
  // the immediate parent, followed by its parent, all the way up to launchd.
  // Using this field will prevent the result from being cached.
  repeated Ancestor ancestors = 6;

  // The file descriptors associated with this process.
  // Using this field will prevent the result from being cached.
  repeated FileDescriptor fds = 7;

  // The path that the executable was run from. This will be the
  // full resolved path.
  // Using this field will prevent the result from being cached.
  string path = 8;
}

// The fields in this message are provided to the CEL program and are static,
// related only to the content of the executable file. The fields inside this
// message will always be the same as long as the content of the file doesn't
// change, which allows Santa to cache the results of CEL expressions that only
// use fields from this message.
message ExecutableFile {
  // The timestamp of when the binary was signed.
  //
  // This timestamp is provided by the developer when this binary was signed.
  // It is possible for developers to set this to whatever they wish when signing
  // unlike the secure_signing_timestamp.
  optional google.protobuf.Timestamp signing_time = 1;

  // The timestamp of when the binary was signed.
  //
  // This timestamp is the secure timestamp that was certified by Apple's timestamp
  // authority service and can be trusted.
  optional google.protobuf.Timestamp secure_signing_time = 2;

  // The signing ID of the binary, if it is validly signed.
  string signing_id = 3;

  // The entitlements of the binary, if it is validly signed.
  // The value will be a JSON representation. Entitlement values are generally
  // either a boolean or a JSON object so when comparing boolean values be sure
  // to use boolean strings "true" or "false".
  map<string, string> entitlements = 4;

  // Whether or not this executable is a platform binary.
  bool is_platform_binary = 5;

  // The team ID of the binary, if it is validly signed.
  string team_id = 6;
}

message Ancestor {
  // The path of the executable for this process.
  string path = 1;

  // This process's signing ID, if the process is validly signed.
  string signing_id = 2;

  // This process's team ID, if the process is validly signed.
  string team_id = 3;

  // This process's CDHash, if this process is validly signed.
  string cdhash = 4;

  // The command-line arguments for this process.
  repeated string args = 5;
}

message FileDescriptor {
  // The file descriptor number.
  uint32 fd = 1;

  // Enum types gathered from `<sys/proc_info.h>`
  enum FDType {
    FD_TYPE_UNKNOWN = 0;
    FD_TYPE_ATALK = 1;
    FD_TYPE_VNODE = 2;
    FD_TYPE_SOCKET = 3;
    FD_TYPE_PSHM = 4;
    FD_TYPE_PSEM = 5;
    FD_TYPE_KQUEUE = 6;
    FD_TYPE_PIPE = 7;
    FD_TYPE_FSEVENTS = 8;
    FD_TYPE_NETPOLICY = 9;
    FD_TYPE_CHANNEL = 10;
    FD_TYPE_NEXUS = 11;
  }

  // The type of the file descriptor.
  FDType type = 2;
}
